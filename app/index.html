<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/logos/hopper-crystal.svg" />
    <title>Bismuth</title>
    <script>
      // Paint the last-known theme BEFORE the bundle loads, so the correct theme shows
      // immediately instead of flashing App.css's default-theme fallbacks until settings
      // hydrate. Reads the var map the app caches under "oa-theme-vars-v1" (see App.tsx);
      // a cold cache is a no-op (the :root fallbacks apply, exactly as before).
      try {
        var t = localStorage.getItem("oa-theme-vars-v1");
        if (t) {
          var vars = JSON.parse(t), root = document.documentElement.style;
          for (var k in vars) if (vars[k] != null) root.setProperty(k, vars[k]);
        }
      } catch (e) {}
    </script>
    <style>
      /* Boot splash: a full-screen, interaction-blocking loading overlay shown from the very
         first paint (before the JS bundle loads) until App signals its initial data is ready.
         Self-contained (no bundle CSS) so it renders instantly. Re-skinned to the ASCII register
         (design/ascii): the --bg ground plus the typed "bismuth" wordmark (matching .asc-wordmark,
         App.css) and a blinking .asc-caret underscore — no images, no color gems. Theme vars are
         already applied by the script above when the cache is warm; every var() here still carries
         a literal fallback (the "ink" theme's tokens, core/src/theme/tokens.ts) for a cold cache,
         same pattern the old markup used. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: var(--bg, #15161a);
        opacity: 1;
        transition: opacity 0.5s ease;
      }
      /* Once ready: stop blocking clicks immediately, then fade out (removed after the transition). */
      #boot-splash.boot-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .bs-mark {
        display: flex;
        align-items: baseline;
        font: 600 20px/1 "Monaspace Xenon", ui-monospace, "SF Mono", monospace;
        letter-spacing: 0.08em;
      }
      /* Mirrors .asc-wordmark's sheen (App.css) — the app's one decorative flourish — with a
         hardcoded gradient fallback since --grad/--sheen are computed by settingsCssVars.ts and
         may not exist yet at first paint. */
      #boot-splash .bs-word {
        background: var(--grad, linear-gradient(100deg, #93bdb0 0%, #8296c6 35%, #a190c4 70%, #93bdb0 100%));
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: bs-sheen var(--sheen, 8s) linear infinite;
      }
      @keyframes bs-sheen { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
      /* Mirrors .asc-caret (ui/ui.css) — the app's one blinking cursor glyph. */
      #boot-splash .bs-caret {
        color: var(--accent, #93bdb0);
        animation: bs-blink var(--blink, 1.1s) step-end infinite;
      }
      @keyframes bs-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bs-word,
        #boot-splash .bs-caret { animation: none; }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Boot splash: covers + blocks the UI while the bundle and the lazy App chunk load. Removed
         by window.__bismuthBootReady() once App's own shell (tree/tabs) has painted its first
         frame (see App.tsx's bootGate wiring) — NOT gated on the /graph fetch, which can take
         seconds on a large vault; the graph keeps rasterizing behind the splash and after it. -->
    <div id="boot-splash" role="progressbar" aria-label="Loading Bismuth" aria-busy="true">
      <div class="bs-mark">
        <span class="bs-word">bismuth</span><span class="bs-caret">_</span>
      </div>
    </div>
    <script>
      // Define the dismiss hook synchronously (before the deferred module bundle runs) so App can
      // always find it. App calls it once its own shell has painted (capped at a hard 1.5s
      // fallback); this 12s timer is the last-resort safety net if App's JS never even runs.
      (function () {
        var done = false;
        function dismiss() {
          if (done) return;
          done = true;
          var el = document.getElementById("boot-splash");
          if (!el) return;
          el.classList.add("boot-done");
          el.setAttribute("aria-busy", "false");
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 600);
        }
        window.__bismuthBootReady = dismiss;
        setTimeout(dismiss, 12000);
      })();
    </script>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
