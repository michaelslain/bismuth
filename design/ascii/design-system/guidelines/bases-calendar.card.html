<!-- @dsCard group="Bases" viewport="700x620" subtitle="Month · week · 3-day · day — events are rows, categories are frontmatter" name="Calendar" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { height: 100%; }
  body { margin:0; font-family: var(--ui-font-stack); font-variant-ligatures: none;
         background: var(--bg); color: var(--fg); font-size: var(--fs-ui);
         display:flex; flex-direction:column; }
  .pane { flex:1; min-height:0; overflow:hidden; position:relative; }
  .pane > div { position:absolute; inset:0; }
  .statusline { flex:none; height:26px; display:flex; align-items:center; gap:6px; padding:0 16px;
                border-top:1px solid var(--border-soft); font-size:10.5px; color:var(--faint); overflow:hidden; white-space:nowrap; }
  .tgrid { overflow:auto; height:100%; }
  .chip { display:block; width:max-content; max-width:100%; box-sizing:border-box; white-space:nowrap;
          overflow:hidden; text-overflow:ellipsis; padding:1px 4px; margin:1px 0; border-radius:2px; }
  .chip.ghost { border:1px solid var(--border); color:var(--text-muted); }
  [hidden] { display:none !important; }
</style></head><body class="ink">
  <div class="viewbar">
    <button class="btn btn--text" title="jump to today">[ today ]</button>
    <button class="btn btn--text" title="previous" style="padding-left:4px;padding-right:4px">&lt;</button>
    <button class="btn btn--text" title="next" style="padding-left:4px;padding-right:4px">&gt;</button>
    <span class="crumb" style="min-width:0;overflow:hidden">
      <span id="crumb" style="color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span></span>
    <div class="vbar-sp"></div>
    <div class="segmented" id="span">
      <button class="btn btn--text btn--selected" data-span="month">MONTH</button>
      <button class="btn btn--text btn--unselected" data-span="week">WEEK</button>
      <button class="btn btn--text btn--unselected" data-span="3day">3 DAY</button>
      <button class="btn btn--text btn--unselected" data-span="day">DAY</button>
    </div>
    <button class="btn btn--text" title="calendar settings">[ settings ]</button>
    <button class="btn btn--text" style="color:var(--accent)" title="new event row">[ + event ]</button>
  </div>
  <div class="pane"><div id="view"></div></div>
  <div class="statusline">events are rows in <span style="color:var(--text-muted)">reading-calendar.base</span> · categories are managed in settings · recurrence expands at read time · drags snap to 30 min</div>
<script>
  // Mirrors app/src/calendar: Category.color is a theme TOKEN (accent/teal/blue/violet/
  // green/gold/rose) so categories recolor with the theme; an event whose category is
  // not in the frontmatter list renders as a GHOST chip (outline, no fill).
  const CATS = [
    { name: "journal", color: "accent" },
    { name: "work",    color: "teal"   },
    { name: "reading", color: "violet" },
    { name: "health",  color: "green"  },
    { name: "social",  color: "gold"   },
    { name: "recall",  color: "rose"   },
  ];
  const catColor = (n) => { const c = CATS.find((x) => x.name === n); return c ? `var(--${c.color})` : null; };

  const D = (day) => new Date(2029, 8, day);        // September 2029; 15th = today (Sat)
  const TODAY = 15;
  const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

  // Singles: one row each in the base's event table. No startTime = all-day.
  const SINGLES = [
    { t: "dentist",       m: 8, d: 18, s: "11:00", e: "11:30", c: "health" },
    { t: "walking notes", m: 8, d: 14, s: "09:00",             c: null    }, // no category -> ghost
    { t: "offsite",       m: 8, d: 20,                         c: "work"  }, // all-day
    { t: "fast day",      m: 8, d: 15,                         c: "health"}, // all-day
    { t: "dinner · ana",  m: 8, d: 21, s: "18:30", e: "21:00", c: "social"},
    { t: "cards due",     m: 8, d: 15, s: "16:00",             c: "recall"},
  ];
  // Recurring masters (recurrence JSON in the row); expanded at read time like dates.ts.
  const CLAUDE_ANCHOR = new Date(2029, 7, 29); // biweekly wednesdays
  const RECUR = [
    { t: "journal",        s: "07:00", e: "07:40", c: "journal", rule: () => true },
    { t: "stand-up",       s: "09:30", e: "10:00", c: "work",    rule: (d) => d.getDay() === 1 },
    { t: "reading circle", s: "19:00", e: "20:30", c: "reading", rule: (d) => d.getDay() === 4 },
    { t: "CLAUDE session", s: "20:00", e: "21:00", c: "work",
      rule: (d) => d.getDay() === 3 && Math.floor(Math.round((d - CLAUDE_ANCHOR) / 864e5) / 7) % 2 === 0 },
  ];
  function eventsFor(date) {
    const out = [];
    SINGLES.forEach((ev) => { if (date.getMonth() === ev.m && date.getDate() === ev.d) out.push(ev); });
    RECUR.forEach((ev) => { if (ev.rule(date)) out.push(ev); });
    return out.sort((a, b) => (a.s || "") < (b.s || "") ? -1 : 1)
              .sort((a, b) => (!a.s ? -1 : 0) - (!b.s ? -1 : 0)); // all-day first
  }

  function chipHtml(ev, withTime) {
    const col = catColor(ev.c);
    const label = (withTime && ev.s ? ev.s + " " : "") + ev.t;
    if (!col) return `<div class="chip ghost">${label}</div>`;
    return `<div class="chip" style="color:${col};background:color-mix(in srgb, ${col} 18%, transparent)">${label}</div>`;
  }

  // MONTH — grid starts at the Monday of the week containing the 1st; adjacent-month
  // cells are dimmed (`out`); today's number is inverse accent. Sep 2029: Mon Aug 27 → Sun Sep 30.
  function renderMonth() {
    const days = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];
    let h = `<div style="display:flex;flex-direction:column;height:100%">`;
    h += `<div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);flex:none">` +
      days.map((d) => `<div style="padding:5px 8px;font-size:10.5px;letter-spacing:.14em;color:var(--faint)">${d}</div>`).join("") + `</div>`;
    h += `<div style="flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;min-height:0">`;
    for (let i = 0; i < 35; i++) {
      const date = new Date(2029, 7, 27 + i);
      const out = date.getMonth() !== 8;
      const today = !out && date.getDate() === TODAY;
      const evs = eventsFor(date);
      const shown = evs.slice(0, 3);
      const more = evs.length - shown.length;
      h += `<div style="border-right:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);padding:3px 5px;overflow:hidden;font-size:10.5px;line-height:1.55;${out ? "opacity:.38;" : ""}">` +
        `<span style="padding:0 3px;${today ? "color:var(--on-accent);background:var(--accent)" : "color:var(--fg)"}">${date.getDate()}</span>` +
        shown.map((ev) => chipHtml(ev, false)).join("") +
        (more > 0 ? `<div style="color:var(--faint)">+${more} more</div>` : "") + `</div>`;
    }
    return h + `</div></div>`;
  }

  // TIME GRID — shared by week / 3-day / day. Sticky day header + sticky all-day row,
  // then one row per hour; timed chips land in their start-hour row.
  function renderTimeGrid(dates) {
    const gutter = 52, hours = [];
    for (let hr = 6; hr <= 22; hr++) hours.push(hr);
    const cols = `grid-template-columns:${gutter}px repeat(${dates.length},1fr)`;
    let h = `<div class="tgrid"><div style="position:sticky;top:0;background:var(--bg);z-index:1">`;
    h += `<div style="display:grid;${cols};border-bottom:1px solid var(--border)">` +
      `<div style="padding:5px 8px;font-size:10.5px;color:var(--faint)">HH</div>` +
      dates.map((d) => {
        const today = d.getMonth() === 8 && d.getDate() === TODAY;
        const lbl = ["SUN","MON","TUE","WED","THU","FRI","SAT"][d.getDay()] + " " + String(d.getDate()).padStart(2, "0");
        return `<div style="padding:5px 8px;font-size:10.5px;letter-spacing:.1em;white-space:nowrap;color:${today ? "var(--accent)" : "var(--faint)"}">${lbl}</div>`;
      }).join("") + `</div>`;
    h += `<div style="display:grid;${cols};border-bottom:1px solid var(--border)">` +
      `<div style="padding:4px 8px;font-size:10.5px;color:var(--faint)">all-day</div>` +
      dates.map((d) => `<div style="padding:4px 6px;font-size:10.5px;border-left:1px solid var(--border-soft)">` +
        eventsFor(d).filter((ev) => !ev.s).map((ev) => chipHtml(ev, false)).join("") + `</div>`).join("") + `</div></div>`;
    hours.forEach((hr) => {
      const hh = String(hr).padStart(2, "0") + ":00";
      h += `<div style="display:grid;${cols};border-bottom:1px solid var(--border-soft);min-height:44px;font-size:11px">` +
        `<div style="padding:9px 8px;color:var(--faint)">${hh}</div>` +
        dates.map((d) => {
          const evs = eventsFor(d).filter((ev) => ev.s && parseInt(ev.s, 10) === hr);
          return `<div style="padding:7px 6px;border-left:1px solid var(--border-soft);overflow:hidden">` +
            evs.map((ev) => chipHtml(ev, true)).join("") + `</div>`;
        }).join("") + `</div>`;
    });
    return h + `</div>`;
  }

  const WEEK = [10, 11, 12, 13, 14, 15, 16].map(D);   // monday-start week containing today
  const THREE = [15, 16, 17].map(D);
  const VIEWS = {
    month: { crumb: "September 2029",           render: renderMonth },
    week:  { crumb: iso(WEEK[0]) + " — " + iso(WEEK[6]), render: () => renderTimeGrid(WEEK) },
    "3day":{ crumb: iso(THREE[0]) + " — " + iso(THREE[2]), render: () => renderTimeGrid(THREE) },
    day:   { crumb: iso(D(TODAY)),              render: () => renderTimeGrid([D(TODAY)]) },
  };

  const view = document.getElementById("view"), crumb = document.getElementById("crumb");
  function show(span) {
    crumb.textContent = VIEWS[span].crumb;
    view.innerHTML = VIEWS[span].render();
    document.querySelectorAll("#span button").forEach((o) => {
      const on = o.dataset.span === span;
      o.classList.toggle("btn--selected", on);
      o.classList.toggle("btn--unselected", !on);
    });
  }
  document.querySelectorAll("#span button").forEach((b) =>
    b.addEventListener("click", () => show(b.dataset.span)));
  show("month");
</script>
</body></html>
