<!-- @dsCard group="Colors" viewport="700x111" subtitle="The five layered grounds — values track the active theme" name="Ground &amp; surfaces" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--ui-font-stack); font-variant-ligatures: none;
         background: var(--bg); color: var(--fg); font-size: var(--fs-ui); }
  .wrap { padding: 14px 16px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 4px; }
  .chip-sw { width: 76px; height: 34px; border: 1px solid var(--border); }
  .lbl { font-size: 10.5px; color: var(--text-muted); white-space: pre; }
  .hex { font-size: 10.5px; color: var(--faint); }
</style></head><body class="ink"><div class="wrap"><div class="row">
<div class="sw"><div class="chip-sw" style="background:var(--rail)"></div><div class="lbl">--rail</div><div class="hex"></div></div>
<div class="sw"><div class="chip-sw" style="background:var(--bg)"></div><div class="lbl">--bg</div><div class="hex"></div></div>
<div class="sw"><div class="chip-sw" style="background:var(--editor)"></div><div class="lbl">--editor</div><div class="hex"></div></div>
<div class="sw"><div class="chip-sw" style="background:var(--surface-1)"></div><div class="lbl">--surface-1</div><div class="hex"></div></div>
<div class="sw"><div class="chip-sw" style="background:var(--surface-2)"></div><div class="lbl">--surface-2</div><div class="hex"></div></div>
<div class="sw"><div class="chip-sw" style="background:var(--surface-3)"></div><div class="lbl">--surface-3</div><div class="hex"></div></div>
</div></div>
<script>
  const toHex = (rgb) => {
    const m = rgb.match(/\d+(\.\d+)?/g);
    if (!m) return rgb;
    const [r, g, b] = m.slice(0, 3).map(Number);
    const a = m[3] !== undefined ? Number(m[3]) : 1;
    const hex = "#" + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, "0")).join("").toUpperCase();
    return a < 1 ? hex + " · " + Math.round(a * 100) + "%" : hex;
  };
  function sync() {
    document.querySelectorAll(".sw").forEach((sw) => {
      const chip = sw.querySelector(".chip-sw");
      const out = sw.querySelector(".hex");
      if (!chip || !out || out.dataset.fixed) return;
      const cs = getComputedStyle(chip);
      // a gradient swatch has no single colour — report the token instead
      out.textContent = cs.backgroundImage !== "none" ? out.dataset.note || "gradient" : toHex(cs.backgroundColor);
    });
  }
  sync();
  // the host switches themes by retagging <body>, so watch for it
  new MutationObserver(sync).observe(document.body, { attributes: true, attributeFilter: ["class"] });
  new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
</script>
</body></html>
