<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--ui-font-stack); font-variant-ligatures: none;
         background: var(--bg); color: var(--fg); font-size: var(--fs-ui); }

  .chip-sw { width: 76px; height: 34px; border: 1px solid var(--border); }
  .lbl { font-size: 10.5px; color: var(--text-muted); white-space: pre; }

  <div class="sw"><div style="width:76px;height:44px;background:var(--surface-1);border-left:2px solid var(--accent)"></div><div class="lbl">2px accent edge</div></div>
</div></div></body></html>
