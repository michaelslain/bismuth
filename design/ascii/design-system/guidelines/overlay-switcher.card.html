<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { height: 100%; }
  body { margin:0; font-family: var(--ui-font-stack); font-variant-ligatures: none;
         background: var(--bg); color: var(--fg); font-size: var(--fs-ui); }
  .stage { position: relative; height: 100%; background: var(--editor); overflow: hidden; }
  .scrim { position:absolute; inset:0; background: var(--overlay-bg); backdrop-filter: blur(1px);
           display:flex; align-items:center; justify-content:center; }
  .lbl { font-size:10.5px; color:var(--faint); letter-spacing:.14em; }
  pre { margin:0; white-space:pre; }
  /* under-layer so the scrim reads as an overlay, not a panel */
  .under { padding:12px 16px; color:var(--faint); font-size:10.5px; line-height:1.8; }
</style></head><body class="ink"><div class="stage">

        <span class="search-bar-lead">&gt;</span><input class="search-bar-input" value="jou" readonly><span class="asc-caret">_</span>
      </div>
      <div style="padding:6px 0">
        <div class="asc-menurow active">
          <span style="color:var(--faint)">✎</span>
          <span>2029-09-15 <span style="color:var(--accent);font-weight:600">jou</span>rnal</span>
          <span class="row-kbd" style="margin-left:auto;color:var(--faint)">journal/</span></div>
        <div class="asc-menurow">
          <span style="color:var(--faint)">✎</span>
          <span>2029-09-12 <span style="color:var(--accent);font-weight:600">jou</span>rnal</span>
          <span class="row-kbd" style="margin-left:auto;color:var(--faint)">journal/</span></div>
        <div class="asc-menurow">
          <span style="color:var(--faint)">▤</span>
          <span>reading.base</span>
          <span class="row-kbd" style="margin-left:auto;color:var(--faint)">bases/</span></div>
        <div class="asc-menurow">
          <span style="color:var(--faint)">✳</span>
          <span>DAEMON</span>
          <span class="row-kbd" style="margin-left:auto;color:var(--faint)">agents/</span></div>
        <div class="asc-menurow">

          <span>CLAUDE</span>

    </div>
  </div>
</div></body></html>
