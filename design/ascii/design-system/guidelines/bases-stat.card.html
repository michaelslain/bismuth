<!-- @dsCard group="Bases" viewport="700x175" subtitle="A single aggregate per tile — the largest type in the system" name="Stat" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { height: 100%; }
  body { margin:0; font-family: var(--ui-font-stack); font-variant-ligatures: none;
         background: var(--bg); color: var(--fg); font-size: var(--fs-ui);
         display:flex; flex-direction:column; }
  .pane { flex:1; min-height:0; overflow:hidden; }
  .lbl { font-size:10.5px; color:var(--faint); letter-spacing:.14em; }
  pre { margin:0; white-space:pre; }
</style></head><body class="ink">
  <div class="viewbar">
    <span class="crumb"><span class="asc-eyebrow">STAT</span>
      <span style="color:var(--text-muted);white-space:nowrap">vault totals · live</span></span>
    <div class="vbar-sp"></div>
    <span style="color:var(--faint);font-size:10.5px;white-space:nowrap">4 tiles</span>
  </div>
  <div class="pane"><div style="padding:22px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px">
    <div>
      <div style="font-size:34px;line-height:1.05;color:var(--fg)">318</div>
      <div style="font-size:11.5px;color:var(--text-muted);margin-top:4px">notes</div>
      <div style="font-size:10.5px;color:var(--faint);margin-top:2px">+12 this month</div></div>
    <div>
      <div style="font-size:34px;line-height:1.05;color:var(--accent)">614</div>
      <div style="font-size:11.5px;color:var(--text-muted);margin-top:4px">edges</div>
      <div style="font-size:10.5px;color:var(--faint);margin-top:2px">+118 · 21d</div></div>
    <div>
      <div style="font-size:34px;line-height:1.05;color:var(--fg)">92</div>
      <div style="font-size:11.5px;color:var(--text-muted);margin-top:4px">tags</div>
      <div style="font-size:10.5px;color:var(--faint);margin-top:2px">9 unused</div></div>
    <div>
      <div style="font-size:34px;line-height:1.05;color:var(--faint)">9</div>
      <div style="font-size:11.5px;color:var(--text-muted);margin-top:4px">orphans</div>
      <div style="font-size:10.5px;color:var(--faint);margin-top:2px">pruned nightly</div></div>
  </div></div>
</body></html>
