<!-- @dsCard group="ASCII" viewport="700x110" subtitle="Data is typed, never drawn" name="Meters &amp; charts" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--ui-font-stack); font-variant-ligatures: none;
         background: var(--bg); color: var(--fg); font-size: var(--fs-ui); }
  .wrap { padding: 14px 16px; }
  .lbl { font-size: 10.5px; color: var(--faint); white-space: pre; }
  pre { margin:0; white-space: pre; }
</style></head><body class="ink"><div class="wrap"><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:10.5px;line-height:12px;color:var(--text-muted)">
  <div>
    <div class="lbl" style="margin-bottom:6px">METER</div>
    <pre>index      <span style="color:var(--accent)">[########..]</span> 82%</pre>
    <pre>confidence <span style="color:var(--accent)">[########..]</span> 0.82</pre>
    <pre>tokens     <span style="color:var(--accent)">[######....]</span> 8.4k</pre>
  </div>
  <div>
    <div class="lbl" style="margin-bottom:6px">EDGE GROWTH · 21d</div>
    <pre>attention   <span style="color:var(--graph-0)">################</span> 118</pre>
    <pre>walking     <span style="color:var(--graph-1)">###########</span>      82</pre>
    <pre>third-brain <span style="color:var(--graph-3)">########</span>         57</pre>
    <pre>lichen      <span style="color:var(--graph-4)">#####</span>            34</pre>
  </div>
</div></div></body></html>
