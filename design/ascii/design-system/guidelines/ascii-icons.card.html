<script>
  // Any character works — the picker just writes it into the three chrome slots
  // that consume a surface glyph (tab rail collapsed, tab rail open, vault tree).
  const slots = ["pv", "pv2", "pv3"].map((id) => document.getElementById(id));
  document.querySelectorAll(".pick").forEach((b) => {
    b.addEventListener("click", () => {
      slots.forEach((s) => (s.textContent = b.textContent));
      document.querySelectorAll(".pick").forEach((o) => {
        o.style.color = "var(--text-muted)"; o.style.borderColor = "var(--border)"; o.style.background = "transparent";
      });
      b.style.color = "var(--accent)"; b.style.borderColor = "var(--accent)"; b.style.background = "var(--accent-soft)";
    });
  });
</script></div></body></html>
