<!-- @dsCard group="Colors" viewport="700x160" subtitle="Ink · Paper · Cathode · Riso" name="Theme scopes" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--ui-font-stack); font-variant-ligatures: none;
         background: var(--bg); color: var(--fg); font-size: var(--fs-ui); }
  .wrap { padding: 14px 16px; }
  .grid { display: grid; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 4px; }
  .chip-sw { width: 76px; height: 34px; border: 1px solid var(--border); }
  .lbl { font-size: 10.5px; color: var(--text-muted); white-space: pre; }
  .hex { font-size: 10.5px; color: var(--faint); }
  pre { margin:0; white-space: pre; }
</style></head><body class="ink"><div class="wrap"><div class="row" style="gap:14px">
  <div class="ink" style="flex:1;padding:10px;background:var(--bg);border:1px solid var(--border)">
    <span class="asc-eyebrow">INK</span>
    <div style="margin-top:8px;color:var(--fg)">daemon idle<span class="asc-caret">_</span></div>
    <div style="color:var(--accent)">[[attention]]</div>
  </div>
  <div class="paper" style="flex:1;padding:10px;background:var(--bg);border:1px solid var(--border)">
    <span class="asc-eyebrow">PAPER</span>
    <div style="margin-top:8px;color:var(--fg)">daemon idle<span class="asc-caret">_</span></div>
    <div style="color:var(--accent)">[[attention]]</div>
  </div>
  <div class="cathode" style="flex:1;padding:10px;background:var(--bg);border:1px solid var(--border)">
    <span class="asc-eyebrow">CATHODE</span>
    <div style="margin-top:8px;color:var(--fg);text-shadow:var(--glow-text)">daemon idle<span class="asc-caret">_</span></div>
    <div style="color:var(--accent)">[[attention]]</div>
  </div>
  <div class="riso" style="flex:1;padding:10px;background:var(--bg);border:1px solid var(--border)">
    <span class="asc-eyebrow">RISO</span>
    <div style="margin-top:8px;color:var(--fg)">daemon idle<span class="asc-caret">_</span></div>
    <div style="color:var(--accent)">[[attention]]</div>
  </div>
</div></div></body></html>
