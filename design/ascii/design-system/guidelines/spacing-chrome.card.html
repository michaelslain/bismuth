<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>

      <div style="height:26px;border-bottom:1px solid var(--border);padding:0 8px;display:flex;align-items:center">view bar · 46px</div>
      <div style="flex:1;padding:6px 8px;color:var(--text-muted)">prose column · max 620px</div>
