<!-- @dsCard group="Type" viewport="700x150" subtitle="Five faces, one metric grid" name="Monaspace variants" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--ui-font-stack); font-variant-ligatures: none;
         background: var(--bg); color: var(--fg); font-size: var(--fs-ui); }
  .wrap { padding: 14px 16px; }
  .grid { display: grid; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 4px; }
  .chip-sw { width: 76px; height: 34px; border: 1px solid var(--border); }
  .lbl { font-size: 10.5px; color: var(--text-muted); white-space: pre; }
  .hex { font-size: 10.5px; color: var(--faint); }
  pre { margin:0; white-space: pre; }
</style></head><body class="ink"><div class="wrap"><div class="grid" style="gap:7px;font-size:13px">
  <div style="font-family:var(--font-xenon)">Xenon — [[graphis scripta]] |-- 03:14 <span class="hex">slab · canonical</span></div>
  <div style="font-family:var(--font-neon)">Neon — [[graphis scripta]] |-- 03:14 <span class="hex">grotesque</span></div>
  <div style="font-family:var(--font-argon)">Argon — [[graphis scripta]] |-- 03:14 <span class="hex">humanist</span></div>
  <div style="font-family:var(--font-krypton)">Krypton — [[graphis scripta]] |-- 03:14 <span class="hex">mechanical</span></div>
  <div style="font-family:var(--font-radon)">Radon — [[graphis scripta]] |-- 03:14 <span class="hex">handwriting</span></div>
</div></div></body></html>
