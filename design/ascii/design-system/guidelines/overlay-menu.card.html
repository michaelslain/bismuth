<!-- @dsCard group="Overlays" viewport="700x300" subtitle="Right-click menu and the transient notice" name="Context menu · Notice" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { height: 100%; }
  body { margin:0; font-family: var(--ui-font-stack); font-variant-ligatures: none;
         background: var(--bg); color: var(--fg); font-size: var(--fs-ui); }
  .stage { position: relative; height: 100%; background: var(--editor); overflow: hidden; }
  .scrim { position:absolute; inset:0; background: var(--overlay-bg); backdrop-filter: blur(1px);
           display:flex; align-items:center; justify-content:center; }
  .lbl { font-size:10.5px; color:var(--faint); letter-spacing:.14em; }
  pre { margin:0; white-space:pre; }
  /* under-layer so the scrim reads as an overlay, not a panel */
  .under { padding:12px 16px; color:var(--faint); font-size:10.5px; line-height:1.8; }
</style></head><body class="ink"><div class="stage">
  <div class="under">
    <div>|-- ▸ journal/</div><div>|   |-- ✎ 2029-09-15</div><div>|   |-- ✎ 2029-09-14</div>
    <div>|-- ▸ bases/</div><div>`-- ▸ inbox/          (3)</div>
  </div>
  <div class="asc-popover" style="position:absolute;left:150px;top:40px;width:216px;padding:5px 0">
    <div class="asc-menurow">
      <span style="width:13px;color:var(--faint)">✎</span>
      <span>Open</span>
      <span class="row-kbd"><span class="asc-kbd"><span class="asc-key">↵</span></span></span>
    </div>
    <div class="asc-menurow">
      <span style="width:13px;color:var(--faint)">⊞</span>
      <span>Open in split</span>
      
    </div>
    <div class="asc-menurow">
      <span style="width:13px;color:var(--faint)">⌗</span>
      <span>Open in new tab</span>
      <span class="row-kbd"><span class="asc-kbd"><span class="asc-key">⌘</span><span class="asc-key">↵</span></span></span>
    </div>
    <div style="height:1px;background:var(--border);margin:5px 0"></div>
    <div class="asc-menurow">
      <span style="width:13px;color:var(--faint)">▤</span>
      <span>New base</span>
      <span class="row-kbd">&gt;</span>
    </div>
    <div style="height:1px;background:var(--border);margin:5px 0"></div>
    <div class="asc-menurow">
      <span style="width:13px;color:var(--faint)">✎</span>
      <span>Rename</span>
      <span class="row-kbd"><span class="asc-kbd"><span class="asc-key">F2</span></span></span>
    </div>
    <div class="asc-menurow">
      <span style="width:13px;color:var(--faint)">⧉</span>
      <span>Duplicate</span>
      
    </div>
    <div class="asc-menurow">
      <span style="width:13px;color:var(--faint)">◈</span>
      <span>Reveal in Finder</span>
      
    </div>
    <div style="height:1px;background:var(--border);margin:5px 0"></div>
    <div class="asc-menurow" style="color:var(--danger)">
      <span style="width:13px;color:var(--faint)">⌫</span>
      <span>Delete</span>
      <span class="row-kbd"><span class="asc-kbd"><span class="asc-key">⌫</span></span></span>
    </div>
  </div>
  <div class="asc-popover" style="position:absolute;right:14px;bottom:14px;width:270px;padding:9px 11px;border-left:2px solid var(--accent)">
    <div style="display:flex;align-items:center;gap:8px">
      <span class="asc-eyebrow">DAEMON</span><div style="flex:1"></div>
      <span style="color:var(--faint);font-size:10.5px">03:14</span></div>
    <div style="margin-top:6px;color:var(--text-muted)">9 orphans pruned. 614 edges resolved.</div>
    <div style="margin-top:8px;display:flex;gap:6px">
      <button class="btn btn--text btn--sm btn--normal">[&nbsp;review&nbsp;]</button>
      <button class="btn btn--text btn--sm btn--unselected">[&nbsp;undo&nbsp;]</button></div>
  </div>
</div></body></html>
