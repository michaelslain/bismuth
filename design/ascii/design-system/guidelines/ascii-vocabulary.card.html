<!-- @dsCard group="ASCII" viewport="700x105" subtitle="Plain ASCII only — no box-drawing characters" name="Glyph vocabulary" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--ui-font-stack); font-variant-ligatures: none;
         background: var(--bg); color: var(--fg); font-size: var(--fs-ui); }
  .wrap { padding: 14px 16px; }
  .lbl { font-size: 10.5px; color: var(--faint); white-space: pre; }
  pre { margin:0; white-space: pre; }
</style></head><body class="ink"><div class="wrap"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:11.5px">
  <div><pre style="color:var(--accent)">-  |  +</pre><div class="lbl">run · run · junction</div></div>
  <div><pre style="color:var(--accent)">/  \</pre><div class="lbl">diagonals</div></div>
  <div><pre style="color:var(--accent)">|--   `--</pre><div class="lbl">branch · last child</div></div>
  <div><pre style="color:var(--accent)">.  o  @</pre><div class="lbl">leaf · linked · hub</div></div>
  <div><pre style="color:var(--accent)">[####......]</pre><div class="lbl">meter</div></div>
  <div><pre style="color:var(--accent)">[ accept ]</pre><div class="lbl">button</div></div>
  <div><pre style="color:var(--accent)">&lt;&lt;   &gt;&gt;   x</pre><div class="lbl">collapse · close</div></div>
  <div><pre style="color:var(--accent)">_</pre><div class="lbl">caret (blinks)</div></div>
</div></div></body></html>
