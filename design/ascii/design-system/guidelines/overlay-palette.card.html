<!-- @dsCard group="Overlays" viewport="700x280" subtitle="⌘K — fuzzy actions, frecency-ordered" name="Command palette" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { height: 100%; }
  body { margin:0; font-family: var(--ui-font-stack); font-variant-ligatures: none;
         background: var(--bg); color: var(--fg); font-size: var(--fs-ui); }
  .stage { position: relative; height: 100%; background: var(--editor); overflow: hidden; }
  .scrim { position:absolute; inset:0; background: var(--overlay-bg); backdrop-filter: blur(1px);
           display:flex; align-items:center; justify-content:center; }
  .lbl { font-size:10.5px; color:var(--faint); letter-spacing:.14em; }
  pre { margin:0; white-space:pre; }
  /* under-layer so the scrim reads as an overlay, not a panel */
  .under { padding:12px 16px; color:var(--faint); font-size:10.5px; line-height:1.8; }
</style></head><body class="ink"><div class="stage">
  <div class="under"><div>~/vault · 318 files</div></div>
  <div class="scrim" style="align-items:flex-start;padding-top:34px">
    <div class="asc-modal" style="width:440px">
      <div class="search-bar" style="border:0;border-bottom:1px solid var(--border);background:transparent;padding:8px 12px">
        <span class="search-bar-lead">&gt;</span>
        <input class="search-bar-input" value="daem" readonly>
        <span class="asc-caret">_</span>
      </div>
      <div style="padding:6px 0;max-height:210px;overflow:hidden">
        <div class="asc-menurow active">
          <span style="color:var(--faint)">◈</span>
          <span>Open command palette</span>
          <span class="row-kbd"><span class="asc-kbd"><span class="asc-key">⌘</span><span class="asc-key">K</span></span></span></div>
        <div class="asc-menurow">
          <span style="color:var(--faint)">✳</span>
          <span>Run <span style="color:var(--accent);font-weight:600">daem</span>on once</span>
          </div>
        <div class="asc-menurow">
          <span style="color:var(--faint)">⁘</span>
          <span>Open knowledge graph</span>
          </div>
        <div class="asc-menurow">
          <span style="color:var(--faint)">▤</span>
          <span>New base…</span>
          </div>
        <div class="asc-menurow">
          <span style="color:var(--faint)">✎</span>
          <span>New note</span>
          <span class="row-kbd"><span class="asc-kbd"><span class="asc-key">⌘</span><span class="asc-key">N</span></span></span></div>
        <div class="asc-menurow">
          <span style="color:var(--faint)">⌗</span>
          <span>Toggle sidebar</span>
          <span class="row-kbd"><span class="asc-kbd"><span class="asc-key">⌘</span><span class="asc-key">\</span></span></span></div>
        <div class="asc-menurow">
          <span style="color:var(--faint)">⏻</span>
          <span>Open terminal</span>
          <span class="row-kbd"><span class="asc-kbd"><span class="asc-key">⌘</span><span class="asc-key">`</span></span></span></div>
      </div>
      <div style="display:flex;gap:12px;padding:7px 12px;border-top:1px solid var(--border);font-size:10.5px;color:var(--faint)">
        <span class="asc-kbd-hint"><span class="asc-kbd"><span class="asc-key">↑</span><span class="asc-key">↓</span></span><span class="asc-kbd-desc">move</span></span>
        <span class="asc-kbd-hint"><span class="asc-kbd"><span class="asc-key">↵</span></span><span class="asc-kbd-desc">run</span></span>
        <span class="asc-kbd-hint"><span class="asc-kbd"><span class="asc-key">esc</span></span><span class="asc-kbd-desc">close</span></span>
        <div style="flex:1"></div><span>matched characters are accented</span>
      </div>
    </div>
  </div>
</div></body></html>
