<!-- @dsCard group="Components" viewport="700x215" subtitle="The 46px view header — one per content view" name="ViewBar" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; font-family:var(--ui-font-stack); font-variant-ligatures:none;
         background:var(--bg); color:var(--fg); font-size:var(--fs-ui); }
  .wrap { padding:14px 16px; display:grid; gap:14px; }
  .lbl { font-size:10.5px; color:var(--faint); letter-spacing:.14em; }
  .row { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .note { font-size:10.5px; color:var(--faint); line-height:1.7; }
</style></head><body class="ink"><div>
  <div class="viewbar">
    <span class="crumb"><span class="asc-eyebrow">DAEMON INBOX</span>
      <span style="color:var(--text-muted)">3 proposals · last run 03:14 · 1.8s</span></span>
    <div class="vbar-sp"></div>
    <div class="segmented">
      <button class="btn btn--text btn--selected">INBOX</button>
      <button class="btn btn--text btn--unselected">LOG</button>
      <button class="btn btn--text btn--unselected">SCHEDULE</button>
    </div>
  </div>
  <div class="viewbar">
    <span class="crumb"><span class="asc-eyebrow">reading.base</span>
      <span style="color:var(--text-muted)">24 rows · 6 fields · sorted by status</span></span>
    <div class="vbar-sp"></div>
    <button class="vbtn">filter</button>
    <button class="vbtn active">group</button>
  </div>
  <div class="viewbar">
    <span class="crumb"><span class="asc-eyebrow">CALENDAR</span>
      <span style="color:var(--text-muted)">September 2029 · 18 entries</span></span>
    <div class="vbar-sp"></div>
    <span style="color:var(--faint);font-size:10.5px">today 15 Sep</span>
  </div>
  <div class="note" style="padding:12px 16px 0">Order is fixed — eyebrow crumb, meta, spacer, then
    controls. Controls never sit on the left.</div>
</div></body></html>
