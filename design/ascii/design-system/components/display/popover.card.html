<!-- @dsCard group="Components" viewport="700x235" subtitle="The floating list surface" name="PopoverList &amp; MenuRow" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; font-family:var(--ui-font-stack); font-variant-ligatures:none;
         background:var(--bg); color:var(--fg); font-size:var(--fs-ui); }
  .wrap { padding:14px 16px; display:grid; gap:14px; }
  .lbl { font-size:10.5px; color:var(--faint); letter-spacing:.14em; }
  .row { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .note { font-size:10.5px; color:var(--faint); line-height:1.7; }
</style></head><body class="ink"><div class="wrap">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div>
      <div class="lbl">POPOVER LIST</div>
      <div class="asc-popover" style="margin-top:7px;padding:6px 0">
        <div style="padding:2px 12px 6px;color:var(--faint);font-size:10.5px;letter-spacing:.14em">RECENT</div>
        <div class="asc-menurow active"><span style="color:var(--faint)">✎</span><span>2029-09-15 journal</span>
          <span class="row-kbd"><span class="asc-kbd"><span class="asc-key">⌘</span><span class="asc-key">O</span></span></span></div>
        <div class="asc-menurow"><span style="color:var(--faint)">▤</span><span>reading.base</span></div>
        <div class="asc-menurow"><span style="color:var(--faint)">◈</span><span>CLAUDE</span></div>
        <div class="asc-menurow"><span style="color:var(--faint)">✳</span><span>DAEMON</span></div>
      </div>
    </div>
    <div>
      <div class="lbl">ROW STATES</div>
      <div class="asc-popover" style="margin-top:7px;padding:6px 0">
        <div class="asc-menurow"><span>rest</span></div>
        <div class="asc-menurow active"><span>hover / selected</span></div>
        <div class="asc-menurow"><span>with shortcut</span>
          <span class="row-kbd"><span class="asc-kbd"><span class="asc-key">⌘</span><span class="asc-key">↵</span></span></span></div>
        <div class="asc-menurow" style="color:var(--danger)"><span>destructive</span></div>
      </div>
    </div>
  </div>
</div></body></html>
