<!-- @dsCard group="Components" viewport="700x185" subtitle="StatusDot · StatusText · Stars" name="Status &amp; rating" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; font-family:var(--ui-font-stack); font-variant-ligatures:none;
         background:var(--bg); color:var(--fg); font-size:var(--fs-ui); }
  .wrap { padding:14px 16px; display:grid; gap:14px; }
  .lbl { font-size:10.5px; color:var(--faint); letter-spacing:.14em; }
  .row { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .note { font-size:10.5px; color:var(--faint); line-height:1.7; }
</style></head><body class="ink"><div class="wrap">
  <div>
    <div class="lbl">STATUS</div>
    <div class="row" style="margin-top:8px">
      <span class="status-text" style="color:var(--blue)"><span class="status-dot"></span>to read</span>
      <span class="status-text" style="color:var(--teal)"><span class="status-dot"></span>reading</span>
      <span class="status-text" style="color:var(--green)"><span class="status-dot"></span>finished</span>
      <span class="status-text" style="color:var(--rose)"><span class="status-dot"></span>abandoned</span>
      <span class="status-text" style="color:var(--faint)"><span class="status-dot"></span>unset</span>
    </div>
  </div>
  <div>
    <div class="lbl">RATING</div>
    <div class="row" style="margin-top:8px;gap:14px">
      <span class="stars"><span class="star-on">*****</span></span><span class="stars"><span class="star-on">****</span>.</span><span class="stars"><span class="star-on">***</span>..</span><span class="stars"><span class="star-on">*</span>....</span><span class="stars"><span class="star-on"></span>.....</span>
    </div>
  </div>
  <div class="note">Status colours are categorical, from the palette ramp — never the semantic
    <span style="color:var(--danger)">danger</span> / <span style="color:var(--success)">success</span> pair.
    A status is a dot plus its word, never a filled pill.</div>
</div></body></html>
