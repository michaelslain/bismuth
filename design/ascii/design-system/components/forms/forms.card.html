<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--ui-font-stack);font-variant-ligatures:none;background:var(--bg);color:var(--fg);font-size:var(--fs-ui)}
.wrap{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}

<body class="ink"><div class="wrap">

      <span style="color:var(--faint);font-size:10.5px">318 files indexed</span></label>
    <label class="ui-field"><span>focused</span>

  </div>

    <div class="asc-frontmatter">
      <div>---</div><div>icon:    (*)</div><div>created: 2029-09-15T07:12</div>
      <div>tags:    [attention, walking]</div><div>brain:   2</div><div>---</div>
    </div>
    <div class="asc-prose" style="margin-top:12px;font-size:13px">I walked the long way home and let the day unspool behind me. The graph remembers what I don't — <span class="asc-tag">#walking</span> keeps returning to <span class="asc-wikilink">[[attention as a resource]]</span>.</div>
  </div>
</div></body></html>
